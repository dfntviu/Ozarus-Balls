<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ozarus & Balls: catálogo fan de personajes de Dragon Ball, GT y Super, con trivia y sopa de letras." />
    <meta name="theme-color" content="#fff4dc" />
    <title>Ozarus & Balls</title>
    <!--
      Aplica el tema ANTES de que React monte, para evitar el parpadeo del tema por defecto.
      Debe coincidir con src/theme/themes.ts (STORAGE_KEY, ids y colores de theme-color).
    -->
    <script>
      (function () {
        var KEY = 'ozarus:theme';
        var THEMES = { orange: '#fff4dc', crimson: '#1a0a0e' };
        var theme;
        try { theme = localStorage.getItem(KEY); } catch (e) {}
        if (!THEMES[theme]) {
          theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'crimson' : 'orange';
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', THEMES[theme]);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
